# Template for data that contains recorded HVAC set temperatures per zone.
# Add the columns to the CSV, adjust the names below and run, for example,
#   pfltc experiments --config configs/set_temperature.yaml
target:
  mode: column
  columns: [z1_set_temp_c, z2_set_temp_c]
features:
  # With a recorded target the comfort votes are legitimate inputs.
  include_vote: true
experiment:
  output_dir: results_set_temperature
